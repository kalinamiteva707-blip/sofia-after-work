<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Honey Box | Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="   --gold:#c79b3b;
    --dark:#1e1e1e;
    --light:#faf9f7;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:var(--light);
    color:var(--dark);
    font-family:'Inter',sans-serif;
    min-height:100vh;
}

.hero{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px;
}

.container{
    max-width:1100px;
    display:flex;
    align-items:center;
    gap:80px;
}

.product{
    flex:1;
}

.product img{
    width:100%;
    max-width:520px;
    border-radius:24px;
    box-shadow:
    0 30px 60px rgba(0,0,0,0.12);
}

.content{
    flex:1;
}

.logo{
    color:var(--gold);
    font-size:24px;
    margin-bottom:25px;
}

h1{
    font-family:'Cormorant Garamond',serif;
    font-size:82px;
    font-weight:600;
    line-height:0.95;
    margin-bottom:20px;
}

.subtitle{
    color:var(--gold);
    font-size:14px;
    letter-spacing:5px;
    text-transform:uppercase;
    margin-bottom:30px;
}

p{
    font-size:18px;
    color:#666;
    line-height:1.8;
    margin-bottom:40px;
}

.coming-soon{
    display:inline-block;
    padding:15px 35px;
    border:1px solid var(--gold);
    border-radius:50px;
    color:var(--gold);
    letter-spacing:3px;
    text-transform:uppercase;
    font-size:13px;
}

.features{
    margin-top:50px;
    display:flex;
    gap:30px;
    flex-wrap:wrap;
}

.feature{
    color:#888;
    font-size:14px;
}

@media(max-width:900px){

.container{
    flex-direction:column;
    text-align:center;
}

h1{
    font-size:56px;
}

.features{
    justify-content:center;
}
}
</style>
</head>

<body>

<section class="hero">

<div class="container">

<div class="product">
    <img src="https://images.unsplash.com/photo-1587049352851-8d4e89133924?auto=format&fit=crop&w=1200&q=80"
         alt="Premium Honey Box">
</div>

<div class="content">

    <div class="title">
        Premium Bulgarian Honey
    </div>

    <h1>
        A Taste Of<br>
        Pure Nature
    </h1>

    <p>
        Discover a curated collection of premium honey,
        handcrafted gifts, and natural treasures sourced
        from Bulgaria's finest beekeepers.
    </p>

    <div class="coming-soon">
        Coming Soon
    </div>

    <div class="features">
        <div class="feature">✦ Artisan Honey</div>
        <div class="feature">✦ Luxury Packaging</div>
        <div class="feature">✦ Made In Bulgaria</div>
    </div>

</div>

</div>

</section>

</body>
</html>
